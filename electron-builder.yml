appId: com.schoolsystem.desktop
productName: School System
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - "!**/*.map"

# better-sqlite3 is a native module and must ship unpacked so the .node binary
# can be loaded from the installed app.
asar: true
asarUnpack:
  - "**/node_modules/better-sqlite3/**"

# Never overwrite the school's data folder during an update.
electronDownload:
  cache: .electron-cache

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: School System
  installerLanguages:
    - en_US
    - ar_SA
  deleteAppDataOnUninstall: false

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: build/icon.icns
  category: public.app-category.education
  artifactName: ${productName}-${version}-${arch}.${ext}

dmg:
  title: ${productName}

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: build/icon.png
  category: Education
  maintainer: School System
  artifactName: ${productName}-${version}.${ext}

publish:
  provider: generic
  url: https://example.invalid/updates
