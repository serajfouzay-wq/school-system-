appId: com.schoolsystem.desktop
productName: School System
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  # The window and taskbar icon is read from here at runtime. Without it the
  # path in main.ts points at nothing inside the package.
  - build/icon.png
  - package.json
  - "!**/*.map"
  # Build-time tools: they run where the package is made, never on a client.
  - "!dist-electron/seed-cli.js"
  - "!dist-electron/bench-cli.js"

# Chromium ships 55 locale files (41 MB) for its own menus and dialogs. The app
# is English and Arabic only, so the rest are dead weight in every download.
electronLanguages:
  - en-US
  - ar

# Swaps in the right native binary when cross-building, and fails the build
# rather than shipping a package that cannot open its own database.
afterPack: build/after-pack.cjs

# better-sqlite3 is a native module and must ship unpacked so the .node binary
# can be loaded from the installed app.
asar: true
asarUnpack:
  - "**/node_modules/better-sqlite3/**"

# Never overwrite the school's data folder during an update.
electronDownload:
  cache: .electron-cache

win:
  target:
    - target: nsis
      arch: [x64]
  # electron-builder generates the .ico from this PNG (it must stay 256x256+).
  icon: build/icon.png
  artifactName: ${productName}-Setup-${version}.${ext}
  # Stamping icon/version data into the .exe runs rcedit under wine, which a
  # Linux build host does not have. A Windows runner sets this back to true;
  # see .github/workflows/build-windows.yml.
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: School System
  installerLanguages:
    - en_US
    - ar_SA
  deleteAppDataOnUninstall: false

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  # electron-builder generates the .icns from this PNG.
  icon: build/icon.png
  category: public.app-category.education
  artifactName: ${productName}-${version}-${arch}.${ext}

dmg:
  title: ${productName}

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: build/icon.png
  category: Education
  maintainer: School System
  artifactName: ${productName}-${version}.${ext}

publish:
  provider: generic
  url: https://example.invalid/updates
